name: Build MelkYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Extract MelkYar project
        run: |
          mkdir -p build-project
          unzip -q MelkYar_Android_Commercial_v1.zip -d build-project
          echo "Project extracted:"
          find build-project -maxdepth 2 -type f | head -50

      - name: Build APK
        working-directory: build-project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MelkYar-debug-APK
          path: build-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
